<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-ar="فصلي — منصة الطالب" data-en="Fasli — Student Platform">فصلي — منصة الطالب</title>
<meta name="description" content="منصة طالب عربية: صفوف ودروس بالفيديو وتقدم يُحسب تلقائيًا.">
<script>try{var _t=JSON.parse(localStorage.getItem('fasli_theme')||'null')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=_t;var _l=JSON.parse(localStorage.getItem('fasli_lang')||'"ar"');document.documentElement.lang=_l;document.documentElement.dir=_l==='ar'?'rtl':'ltr';}catch(e){}</script>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home" data-active="home">
<header id="site-header" class="site-header"></header>
<main>
  <section class="hero" role="img" aria-label="رسم توضيحي لمكتب معلمة عليه كتب وسبورة وكوب أقلام">
    <div class="wrap hero-inner">
      <span class="kicker" data-i18n="hero.kicker"></span>
      <h1 data-i18n="hero.title"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="cta-row">
        <a class="btn btn-primary" href="login.html" data-i18n="hero.cta1"></a>
        <a class="btn btn-ghost" href="#grades" data-i18n="hero.cta2"></a>
      </div>
    </div>
  </section>

  <section class="section" id="grades">
    <div class="wrap">
      <div class="section-head">
        <span class="kicker" data-i18n="grades.kicker"></span>
        <h2 data-i18n="grades.title"></h2>
        <p data-i18n="grades.sub"></p>
      </div>
      <div class="grade-grid" id="grade-grid"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <span class="kicker" data-i18n="feat.kicker"></span>
        <h2 data-i18n="feat.title"></h2>
      </div>
      <div class="feat-grid">
        <div class="feat"><div class="ico">👩‍🏫</div><h3 data-i18n="feat1.t"></h3><p data-i18n="feat1.p"></p></div>
        <div class="feat"><div class="ico">🎬</div><h3 data-i18n="feat2.t"></h3><p data-i18n="feat2.p"></p></div>
        <div class="feat"><div class="ico">📈</div><h3 data-i18n="feat3.t"></h3><p data-i18n="feat3.p"></p></div>
        <div class="feat"><div class="ico">🌗</div><h3 data-i18n="feat4.t"></h3><p data-i18n="feat4.p"></p></div>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
